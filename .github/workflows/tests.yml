name: Pruebas
on: [push, pull_request]
permissions:
  contents: read
jobs:
  regresion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest test_regresion test_narracion_regresion test_tapete_completo
      - run: python test_contacto.py
      - run: python stress_precision.py
